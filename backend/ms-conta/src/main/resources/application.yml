server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: ms-conta
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}?currentSchema=ms_conta
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      # DDL e schema sao gerenciados pelos scripts em db/ (ver docs/design/modelagem-ct.md),
      # nunca pelo Hibernate. `validate` apenas confirma na subida que as entidades
      # batem com as tabelas reais (command + query side).
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ms_conta
        jdbc:
          time_zone: America/Sao_Paulo
