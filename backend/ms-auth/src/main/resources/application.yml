server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: ms-auth
  data:
    mongodb:
      host: ${MONGO_HOST:localhost}
      port: ${MONGO_PORT:27017}
      username: ${MONGO_USER:}
      password: ${MONGO_PASSWORD:}
      authentication-database: admin
      database: ${MONGO_DB:ms_auth}
      # Sem isto, @Indexed(unique = true) em Usuario.login não cria o índice
      # de verdade — Spring Data MongoDB desabilita a criação automática por
      # padrão desde a v3 (achado revisando a Semana 03: um login duplicado
      # era aceito sem erro nenhum).
      auto-index-creation: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 5000
