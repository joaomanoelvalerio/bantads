spring.application.name=ms-email

# RabbitMQ — nomes têm que bater com o que o docker-compose.yml passa ao
# container (RABBITMQ_*, não RABBIT_*) — sem isso cai no fallback guest/guest,
# que o RabbitMQ recusa fora de localhost.
spring.rabbitmq.host=${RABBITMQ_HOST:rabbitmq}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# Configurações do SMTP
spring.mail.host=${MAIL_HOST:sandbox.smtp.mailtrap.io}
spring.mail.port=${MAIL_PORT:2525}
spring.mail.username=${MAIL_USER:seu_usuario}
spring.mail.password=${MAIL_PASS:sua_senha}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true