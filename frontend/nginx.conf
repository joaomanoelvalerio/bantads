server {
    listen 80;
    root /usr/share/nginx/html;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "OK";
    }

    # Rotas do Angular (/login, /cliente/extrato...) não existem como arquivo:
    # caem no index.html e o roteador do front resolve.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
