services:
  frontend:
    build: ./frontend
    mem_limit: 64m
    ports:
      - "4200:80"
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health"]

  gateway:
    build: ./backend/api-gateway
    mem_limit: 256m
    ports:
      # Ponto único de acesso ao back-end; o front roda no navegador do
      # host e chama `environment.apiUrl` = localhost:3000.
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_OPTIONS=--max-old-space-size=192
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
    depends_on:
      ms-cliente:
        condition: service_healthy
      ms-gerente:
        condition: service_healthy
      ms-conta:
        condition: service_healthy
      ms-auth:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health"]

  postgres:
    image: postgres:16
    mem_limit: 384m
    ports:
      # Exposto para acesso via DBeaver/psql do host — exigido aberto na
      # defesa.
      - "5432:5432"
    env_file:
      - .env
    command: ["postgres", "-c", "shared_buffers=128MB"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Scripts de init rodam uma única vez, em ordem, na primeira subida do
      # volume — um schema por microsservico (schema-per-service).
      - ./backend/ms-cliente/db/01-schema.sql:/docker-entrypoint-initdb.d/10-ms-cliente-schema.sql
      - ./backend/ms-cliente/db/02-seed.sql:/docker-entrypoint-initdb.d/11-ms-cliente-seed.sql
      - ./backend/ms-conta/db/01-schema.sql:/docker-entrypoint-initdb.d/20-ms-conta-schema.sql
      - ./backend/ms-conta/db/02-seed.sql:/docker-entrypoint-initdb.d/21-ms-conta-seed.sql
      - ./backend/ms-gerente/db/01-schema.sql:/docker-entrypoint-initdb.d/30-ms-gerente-schema.sql
      - ./backend/ms-gerente/db/02-seed.sql:/docker-entrypoint-initdb.d/31-ms-gerente-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]

  orquestrador:
    build: ./backend/orquestrador
    mem_limit: 512m
    mem_reservation: 384m
    environment:
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=60 -XX:+UseSerialGC
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health"]
      start_period: 40s

  ms-email:
    build: ./backend/ms-email
    mem_limit: 512m
    mem_reservation: 384m
    env_file:
      - .env
    environment:
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=60 -XX:+UseSerialGC
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health"]
      start_period: 40s

  ms-cliente:
    build: ./backend/ms-cliente
    mem_limit: 512m
    mem_reservation: 384m
    environment:
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=60 -XX:+UseSerialGC
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB}
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}

    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./backend/ms-cliente/db/02-seed.sql:/app/db/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9090/health"]
      start_period: 40s

  ms-gerente:
    build: ./backend/ms-gerente
    mem_limit: 512m
    mem_reservation: 384m
    environment:
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=60 -XX:+UseSerialGC
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB}
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./backend/ms-gerente/db/02-seed.sql:/app/db/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health"]
      start_period: 40s

  ms-conta:
    build: ./backend/ms-conta
    mem_limit: 512m
    mem_reservation: 384m
    environment:
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=60 -XX:+UseSerialGC
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB}
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}

    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./backend/ms-conta/db/02-seed.sql:/app/db/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/health"]
      start_period: 40s

  ms-auth:
    build: ./backend/ms-auth
    mem_limit: 512m
    mem_reservation: 384m
    environment:
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=60 -XX:+UseSerialGC
      - MONGO_HOST=mongo
      - MONGO_PORT=27017
      - MONGO_USER=${MONGO_USER}
      - MONGO_PASSWORD=${MONGO_PASSWORD}
      - MONGO_DB=ms_auth
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
    depends_on:
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8082/health"]
      start_period: 40s

  mongo:
    image: mongo:7
    mem_limit: 384m
    env_file:
      - .env
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.25"]
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "-u",
          "${MONGO_USER}",
          "-p",
          "${MONGO_PASSWORD}",
          "--authenticationDatabase",
          "admin",
          "--eval",
          "db.adminCommand({ ping: 1 })",
        ]

  redis:
    image: redis:7
    mem_limit: 128m
    command:
      [
        "redis-server",
        "--maxmemory",
        "100mb",
        "--maxmemory-policy",
        "noeviction",
      ]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]

  rabbitmq:
    image: rabbitmq:3-management
    mem_limit: 512m
    ports:
      # Console de gestão exigido aberto na defesa.
      - "15672:15672"
    env_file:
      - .env
    environment:
      # Sem o override o 0.6 é calculado sobre a RAM do host, não sobre o
      # mem_limit — o contêiner seria morto por OOM antes do alarme disparar.
      # 536870912 = 512m, o mesmo valor do mem_limit acima.
      - RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS=-rabbit vm_memory_high_watermark 0.6 -rabbit total_memory_available_override_value 536870912
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]

volumes:
  postgres_data:
  mongo_data:

# Rede interna explícita: todos os serviços entram nela por padrão e se
# enxergam pelo nome do serviço; para fora, só as portas publicadas.
networks:
  default:
    name: bantads
